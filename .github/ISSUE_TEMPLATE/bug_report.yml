name: Bug report
description: Something in Stowaway doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! This issue will be **public**: leave out passwords, keys, tokens, host names, IP addresses and anything else you don't want on the internet.
        Security problems don't belong here: see [SECURITY.md](https://github.com/niogtres/stowaway/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
  - type: input
    id: version
    attributes:
      label: Stowaway version
      description: In the web client under *About*.
      placeholder: "0.9.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 Pro 24H2
  - type: dropdown
    id: engine
    attributes:
      label: Docker engine
      options:
        - Docker Desktop (Linux containers)
        - Docker Engine in WSL 2
        - Docker Engine with Windows containers
        - Other / not sure
    validations:
      required: true
  - type: input
    id: engine-version
    attributes:
      label: Docker version
      description: Shown at the top of the web client, or `docker version`.
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      multiple: true
      options:
        - Inventory
        - Backups / plans
        - Restore
        - Restore drills
        - Destinations
        - Database dumps
        - Sign-in / remote access
        - Notifications / tray
        - Installer / upgrade
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The run's log from *Activity*, and/or the relevant lines from `C:\ProgramData\Stowaway\logs`. Remove anything private first.
      render: text
