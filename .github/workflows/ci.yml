name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build, test and package
        shell: pwsh
        run: ./build.ps1 -Version "0.7.${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: Stowaway-msi
          path: artifacts/*.msi
          if-no-files-found: error
          retention-days: 14
