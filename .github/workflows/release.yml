name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build, test and package
        shell: pwsh
        env:
          # Optional: with these repository secrets set, the service executable and the MSI are Authenticode-signed.
          DOCKERBACKUP_SIGN_PFX: ${{ secrets.DOCKERBACKUP_SIGN_PFX }}
          DOCKERBACKUP_SIGN_PFX_PASSWORD: ${{ secrets.DOCKERBACKUP_SIGN_PFX_PASSWORD }}
        run: ./build.ps1 -Version ('${{ github.ref_name }}'.TrimStart('v'))

      - name: winget manifests and checksum
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $msi = "artifacts/DockerBackup-$version-x64.msi"
          ./tools/New-WingetManifest.ps1 -Version $version -Msi $msi `
            -InstallerUrl "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/DockerBackup-$version-x64.msi"
          Compress-Archive -Path artifacts/winget/* -DestinationPath "artifacts/winget-manifests-$version.zip"
          (Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant() + "  DockerBackup-$version-x64.msi" |
            Set-Content -Encoding ascii "artifacts/DockerBackup-$version-x64.msi.sha256"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/*.msi artifacts/*.sha256 artifacts/winget-manifests-*.zip --title "DockerBackup ${{ github.ref_name }}" --generate-notes
